<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worker Job Search</title><link rel="stylesheet" href="style.css"></head><body>

<!-- =========================================

========================================= -->

  <div class="header-container">


    <!-- BRAND -->

    <a href="dashboard.html" class="brand">

      <div class="brand-icon">

      </div>

      <div class="brand-text">

        <h2>Contractor Job Network</h2>

        <span>
          Industrial Workforce Management
        </span>

      </div>

    </a>



    <!-- TOP NAVIGATION -->

    <nav class="top-nav">


      

      <a href="my-jobs.html"
         class="top-nav-item">

        💼

        <span>My Jobs</span>

      </a>


      <a href="notifications.html"
         class="top-nav-item">

        🔔

        <span>Notifications</span>

      </a>


    </nav>



    <!-- HAMBURGER MENU -->

    <button
      class="menu-btn"
      onclick="toggleMenu()"
      aria-label="Open Menu">

      ☰

    </button>


  </div>



  <!-- =========================================
       SIDE MENU
  ========================================= -->

  <div
    class="side-menu"
    id="sideMenu">


    <!-- MENU HEADER -->

    <div class="menu-header">


      <div>

        <h3>Menu</h3>

        <p>
          Contractor Panel
        </p>

      </div>


      <button
        class="close-menu"
        onclick="toggleMenu()">

        ✕

      </button>


    </div>



    <!-- MENU LINKS -->

    <a href="worker-search.html">

    </a>


    <a href="add-job.html">

    </a>


    <a href="referrals.html">

    </a>


    <a href="subscription.html">

    </a>


    <a href="profile.html">

    </a>



    <div class="menu-divider"></div>



    <!-- LOGOUT -->

      class="side-logout"
      onclick="logout()">

      🚪 Logout

    </button>


  </div>



  <!-- BACKGROUND OVERLAY -->

  <div

    id="menuOverlay"

  </div>


</header><div class="container">
<div class="card"><h1>Search Job for Worker</h1><form id="form" class="grid">
<input name="workerName" placeholder="Worker Name" required><input name="workerMobile" placeholder="Worker Mobile" required><input name="qualification" placeholder="Qualification"><input name="trade" placeholder="Trade"><input name="experience" type="number" placeholder="Experience (years)"><input name="preferredJob" placeholder="Preferred Job"><input name="preferredLocation" placeholder="Preferred Location"><input name="skills" placeholder="Skills comma separated"><button class="orange">Search Matching Jobs</button></form></div><div id="results"></div>
</div><script src="js/config.js"></script>
<script>


/* =========================================
   LOGIN CHECK
========================================= */

requireLogin();



/* =========================================
   HAMBURGER MENU
========================================= */

function toggleMenu(){

  const menu =
    document.getElementById("sideMenu");

  const overlay =
    document.getElementById("menuOverlay");


  menu.classList.toggle("show");

  overlay.classList.toggle("show");

}



/* =========================================
   LOAD DASHBOARD DATA
========================================= *

(async () => {

  try {


    /* ================================
       API REQUESTS
    ================================ *

    const me =
      await api("/contractors/me");


    const jobs =
      await api("/jobs/my");


    const sent =
      await api("/referrals/sent");


    const received =
      await api("/referrals/received");


    const notifications =
      await api("/notifications/");



    /* ================================
       CONTRACTOR DATA
    ================================ *

    const contractor =
      me.contractor;



    /* ================================
       WELCOME SECTION
    ================================ */

    welcome.innerHTML = `

      <h2>
        Welcome, ${contractor.contractorName || "Contractor"} 👋
      </h2>


      <p class="muted">

        📍
        ${contractor.industrialArea || ""}

        ${contractor.city || ""}

      </p>

    `;



    /* ================================
       UNREAD NOTIFICATIONS
    ================================ */

    const unreadCount =
      notifications.notifications
        .filter(notification =>
          !notification.isRead
        )
        .length;



    /* ================================
       STATISTICS
    ================================ */

    stats.innerHTML = `


      <div class="card">

        <div class="muted">

          💼 My Jobs

        </div>


        <div class="stat">

          ${jobs.jobs.length}

        </div>

      </div>



      <div class="card">

        <div class="muted">

          📤 Sent Referrals

        </div>


        <div class="stat">

          ${sent.referrals.length}

        </div>

      </div>



      <div class="card">

        <div class="muted">

          📥 Received Referrals

        </div>


        <div class="stat">

          ${received.referrals.length}

        </div>

      </div>



      <div class="card">

        <div class="muted">

          🔔 Unread Notifications

        </div>


        <div class="stat">

          ${unreadCount}

        </div>

      </div>


    `;


  }


  /* =========================================
     ERROR
  ========================================= */

  catch (error) {


    console.error(
      "Dashboard Error:",
      error
    );


    alert(
      error.message ||
      "Unable to load dashboard"
    );


  }


})();

</script>

<script>
requireLogin();

let worker = {};

form.onsubmit = async e => {
  e.preventDefault();

  worker = Object.fromEntries(new FormData(form));

  try {

    const params = new URLSearchParams();

    params.set("workerName", worker.workerName || "");
    params.set("workerMobile", worker.workerMobile || "");
    params.set("qualification", worker.qualification || "");
    params.set("trade", worker.trade || "");
    params.set("experience", worker.experience || "0");
    params.set("preferredJob", worker.preferredJob || "");

    // IMPORTANT
    // preferredLocation ko backend ke "location" mein bhejna hai
    params.set("location", worker.preferredLocation || "");

    params.set("skills", worker.skills || "");

    const r = await api("/jobs/search?" + params.toString());

    results.innerHTML = r.jobs.length
      ? r.jobs.map(j => `
        <div class="card">

          <div class="match">
            ⭐ ${j.matchScore}% Match
          </div>

          <h2>${j.jobTitle}</h2>

          <p>
            <b>${j.companyName}</b>
            • ${j.companyLocation || ""}
          </p>

          <p>
            Qualification:
            ${j.qualification || "-"}
            |
            Trade:
            ${j.trade || "-"}
          </p>

          <p>
            Experience:
            ${j.experienceMin || 0}-${j.experienceMax || 99} years
          </p>

          <p>
            Salary:
            ₹${j.salaryMin || 0}
            -
            ₹${j.salaryMax || 0}
          </p>

          <p>
            Skills:
            ${j.skills?.join(", ") || "-"}
          </p>

          <p>
            Remaining Vacancies:
            <b>${j.workersRemaining}</b>
          </p>

          <p>
            Matched Skills:
            <b>
              ${j.matchedSkills?.join(", ") || "None"}
            </b>
          </p>

          <button
            class="orange"
            onclick="refer('${j._id}')">
            Refer Worker
          </button>

        </div>
      `).join("")

      : `
        <div class="card">
          No suitable jobs found.
        </div>
      `;

  } catch (err) {

    results.innerHTML = `
      <div class="notice error">
        ${err.message}
      </div>
    `;
  }
};


async function refer(jobId) {

  if (!confirm("Refer this worker?")) return;

  try {

    await api("/referrals", {
      method: "POST",
      body: JSON.stringify({
        ...worker,
        jobId
      })
    });

    alert("Worker referred successfully");

  } catch (e) {

    alert(e.message);

  }
}
</script></body></html>
