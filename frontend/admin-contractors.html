<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Contractors</title><link rel="stylesheet" href="style.css"></head><body><div class="container">
<h1>Contractors</h1><div id="list"></div>
</div><script src="js/config.js"></script><script>
requireAdmin();async function load(){const r=await api('/admin/contractors',{},true);list.innerHTML=`<div class="table-wrap"><table><tr><th>Contractor</th><th>Owner</th><th>Mobile</th><th>Location</th><th>Status</th><th>Active</th><th>Action</th></tr>${r.contractors.map(c=>`<tr><td>${c.contractorName}</td><td>${c.ownerName}</td><td>${c.mobile}</td><td>${c.industrialArea||''} ${c.city||''}</td><td>${c.verificationStatus}</td><td>${c.isActive?'Yes':'No'}</td><td class="actions"><button class="small green" onclick="updateC('${c._id}',{verificationStatus:'Approved'})">Approve</button><button class="small red" onclick="updateC('${c._id}',{verificationStatus:'Rejected'})">Reject</button><button class="small" onclick="updateC('${c._id}',{isActive:${!c.isActive}})">${c.isActive?'Deactivate':'Activate'}</button></td></tr>`).join('')}</table></div>`}async function updateC(id,data){try{await api('/admin/contractors/'+id,{method:'PATCH',body:JSON.stringify(data)},true);load()}catch(e){alert(e.message)}}load();
</script></body></html>
