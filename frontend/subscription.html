      <a href="my-jobs.html"

  <!-- =========================================

</header><div class="container">
<h1>Subscription</h1><div id="current"></div><div class="grid" id="plans"></div>
</div><script src="js/config.js"></script><script>
requireLogin();async function load(){try{const r=await api('/subscription/');const s=r.subscription,u=r.usage,l=r.limits;current.innerHTML=`<div class="card"><h2>Current Plan: ${s.plan}</h2><p>₹${s.price}/month</p><p>Job Requirements: ${u.jobRequirements} / ${l.jobRequirements===-1?'Unlimited':l.jobRequirements}</p><p>Worker Searches: ${u.workerSearches} / ${l.workerSearches===-1?'Unlimited':l.workerSearches}</p><p>Referrals: ${u.referrals} / ${l.referrals===-1?'Unlimited':l.referrals}</p></div>`;plans.innerHTML=Object.entries(r.plans).map(([name,p])=>`<div class="card"><h2>${name}</h2><div class="stat">₹${p.price}</div><p>Jobs: ${p.jobRequirements===-1?'Unlimited':p.jobRequirements}</p><p>Searches: ${p.workerSearches}</p><p>Referrals: ${p.referrals}</p><button onclick="changePlan('${name}')">${name===s.plan?'Current Plan':'Choose Plan'}</button></div>`).join('')}catch(e){alert(e.message)}}async function changePlan(plan){if(!confirm('Demo mode: change to '+plan+'? Payment gateway must be added before production.'))return;try{const r=await api('/subscription/change-plan',{method:'POST',body:JSON.stringify({plan})});alert(r.message);load()}catch(e){alert(e.message)}}load();
</script></body></html>
