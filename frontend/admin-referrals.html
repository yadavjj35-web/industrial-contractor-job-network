<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Referrals</title><link rel="stylesheet" href="style.css"></head><body><div class="container">
<h1>All Referrals</h1><div id="list"></div>
</div><script src="js/config.js"></script><script>
requireAdmin();(async()=>{try{const r=await api('/admin/referrals',{},true);list.innerHTML=`<div class="table-wrap"><table><tr><th>Worker</th><th>Job</th><th>From</th><th>To</th><th>Status</th><th>Date</th></tr>${r.referrals.map(x=>`<tr><td>${x.workerName}<br>${x.workerMobile}</td><td>${x.jobId?.jobTitle||''}</td><td>${x.referredBy?.contractorName||''}</td><td>${x.referredTo?.contractorName||''}</td><td>${x.status}</td><td>${new Date(x.createdAt).toLocaleDateString()}</td></tr>`).join('')}</table></div>`}catch(e){list.textContent=e.message}})();
</script></body></html>
