</header><div class="container">
<h1>Notifications</h1><button onclick="readAll()">Mark All Read</button><div id="list" style="margin-top:15px"></div>
</div><script src="js/config.js"></script><script>
requireLogin();async function load(){try{const r=await api('/notifications/');list.innerHTML=r.notifications.length?r.notifications.map(n=>`<div class="card"><h3>${n.isRead?'':'🔵 '}${n.title}</h3><p>${n.message}</p><small>${new Date(n.createdAt).toLocaleString()}</small></div>`).join(''):'<div class="card">No notifications.</div>'}catch(e){alert(e.message)}}async function readAll(){await api('/notifications/read-all',{method:'PATCH'});load()}load();
</script></body></html>
