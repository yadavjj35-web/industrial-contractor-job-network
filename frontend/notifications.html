<!-- =========================================
     NOTIFICATIONS CONTENT
========================================= -->

<div class="container">

  <h1>Notifications</h1>


  <button
    type="button"
    onclick="readAll()">

    Mark All Read

  </button>


  <div
    id="list"
    style="margin-top:15px">

  </div>

</div>


<!-- =========================================
     CONFIG
========================================= -->

<script src="js/config.js"></script>


<script>

/* =========================================
   LOGIN CHECK
========================================= */

requireLogin();


/* =========================================
   HAMBURGER MENU
========================================= */

function toggleMenu() {

  const menu =
    document.getElementById("sideMenu");

  const overlay =
    document.getElementById("menuOverlay");

  menu.classList.toggle("show");

  overlay.classList.toggle("show");

}


/* =========================================
   LOAD NOTIFICATIONS
========================================= */

async function loadNotifications() {

  const list =
    document.getElementById("list");


  try {

    /*
      Backend currently returns:

      res.json(notifications)

      Therefore response itself is
      the notifications array.
    */

    const notifications =
      await api("/notifications/");


    console.log(
      "Notifications:",
      notifications
    );


    /* =====================================
       NO NOTIFICATIONS
    ===================================== */

    if (
      !Array.isArray(notifications) ||
      !notifications.length
    ) {

      list.innerHTML = `
        <div class="card">
          No notifications.
        </div>
      `;

      return;

    }


    /* =====================================
       DISPLAY NOTIFICATIONS
    ===================================== */

    list.innerHTML =
      notifications
        .map(notification => {

          const unread =
            !notification.isRead;


          const createdAt =
            notification.createdAt
              ? new Date(
                  notification.createdAt
                ).toLocaleString()
              : "";


          return `

            <div
              class="card"
              style="
                margin-bottom:12px;
                ${
                  unread
                    ? "border-left:4px solid #2563eb;"
                    : ""
                }
              ">

              <h3>

                ${
                  unread
                    ? "🔵 "
                    : ""
                }

                ${escapeHTML(
                  notification.title ||
                  "Notification"
                )}

              </h3>


              <p>

                ${escapeHTML(
                  notification.message ||
                  ""
                )}

              </p>


              <small>

                ${escapeHTML(
                  createdAt
                )}

              </small>

            </div>

          `;

        })
        .join("");


  } catch (error) {

    console.error(
      "Notifications Error:",
      error
    );


    list.innerHTML = `

      <div class="card">

        Unable to load notifications.

      </div>

    `;


    alert(
      error.message ||
      "Unable to load notifications"
    );

  }

}


/* =========================================
   MARK ALL AS READ
========================================= */

async function readAll() {

  try {

    await api(
      "/notifications/read-all",
      {
        method: "PATCH"
      }
    );


    await loadNotifications();


  } catch (error) {

    console.error(
      "Mark All Read Error:",
      error
    );


    alert(
      error.message ||
      "Unable to mark notifications as read"
    );

  }

}


/* =========================================
   HTML SECURITY
========================================= */

function escapeHTML(value) {

  const div =
    document.createElement("div");


  div.textContent =
    value == null
      ? ""
      : String(value);


  return div.innerHTML;

}


/* =========================================
   INITIAL LOAD
========================================= */

loadNotifications();

</script>

</body>
