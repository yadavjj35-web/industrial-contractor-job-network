<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Monthly Reward Dashboard</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .reward-admin-page {
            max-width: 1250px;
            margin: auto;
            padding: 20px;
        }

        .page-header {
            margin-bottom: 20px;
        }

        .page-header h1 {
            margin-bottom: 6px;
        }

        .filter-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: end;
            background: #f5f7fa;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .filter-box label {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-weight: 600;
        }

        .filter-box input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .load-btn {
            border: none;
            background: #0d6efd;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .period-box {
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 15px;
        }

        .summary-card span {
            color: #666;
            font-size: 14px;
        }

        .summary-card strong {
            display: block;
            font-size: 24px;
            margin-top: 6px;
        }

        .record-list {
            display: grid;
            gap: 15px;
        }

        .record-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 18px;
        }

        .record-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .worker-name {
            font-size: 20px;
            font-weight: 700;
        }

        .mobile {
            color: #555;
            margin-top: 5px;
        }

        .info-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .info-box {
            background: #f7f7f7;
            padding: 11px;
            border-radius: 9px;
        }

        .info-box small {
            display: block;
            color: #666;
            margin-bottom: 4px;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin: 2px;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .working {
            background: #d1e7dd;
            color: #0f5132;
        }

        .not-working {
            background: #f8d7da;
            color: #842029;
        }

        .disputed {
            background: #ffe5d0;
            color: #984c0c;
        }

        .verified {
            background: #cff4fc;
            color: #055160;
        }

        .reward-section {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            background: #f5f7fa;
        }

        .reward-input {
            width: 180px;
            max-width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-top: 8px;
        }

        .finalize-btn {
            border: none;
            background: #198754;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 12px;
        }

        .reject-btn {
            border: none;
            background: #dc3545;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 12px;
            margin-left: 8px;
        }

        .dispute-working-btn {
            border: none;
            background: #198754;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 12px;
        }

        .dispute-not-working-btn {
            border: none;
            background: #dc3545;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 12px;
            margin-left: 8px;
        }

        .decision-note {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }

        .finalized {
            background: #eef7ee;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .empty-box {
            text-align: center;
            padding: 45px 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

        .error-box {
            background: #f8d7da;
            color: #842029;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .export-btn {
            border: none;
            background: #6f42c1;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        @media (max-width: 600px) {

            .reward-admin-page {
                padding: 12px;
            }

            .record-card {
                padding: 14px;
            }

            .finalize-btn,
            .reject-btn,
            .load-btn,
            .export-btn,
            .dispute-working-btn,
            .dispute-not-working-btn {
                width: 100%;
                margin-left: 0;
            }

        }

    </style>

</head>


<body>

<div class="reward-admin-page">

    <div class="page-header">

        <h1>
            💰 Monthly Reward Dashboard
        </h1>

        <p>
            ContractorHub Monthly Referral Reward Management
        </p>

    </div>


    <div class="filter-box">

        <label>

            Verification Date

            <input
                type="date"
                id="verificationDate"
            >

        </label>


        <button
            type="button"
            class="load-btn"
            id="loadBtn"
        >
            🔄 Load Report
        </button>


        <button
            type="button"
            class="export-btn"
            id="exportBtn"
        >
            📊 Export CSV
        </button>

    </div>


    <div
        id="errorBox"
        class="error-box"
        style="display:none;"
    ></div>


    <div
        id="periodBox"
        class="period-box"
    >
        Select verification date and load report.
    </div>


    <div class="summary-grid">

        <div class="summary-card">
            <span>Total Workers</span>
            <strong id="totalWorkers">0</strong>
        </div>


        <div class="summary-card">
            <span>Working</span>
            <strong id="workingWorkers">0</strong>
        </div>


        <div class="summary-card">
            <span>Not Working</span>
            <strong id="notWorkingWorkers">0</strong>
        </div>


        <div class="summary-card">
            <span>Disputed</span>
            <strong id="disputedWorkers">0</strong>
        </div>


        <div class="summary-card">
            <span>Finalized</span>
            <strong id="finalizedWorkers">0</strong>
        </div>


        <div class="summary-card">
            <span>Gross Reward</span>
            <strong id="grossReward">₹0</strong>
        </div>


        <div class="summary-card">
            <span>Admin Commission</span>
            <strong id="adminCommission">₹0</strong>
        </div>


        <div class="summary-card">
            <span>Contractor Payable</span>
            <strong id="contractorReward">₹0</strong>
        </div>

    </div>


    <div
        id="loading"
        class="loading"
        style="display:none;"
    >
        Loading reward report...
    </div>


    <div
        id="recordList"
        class="record-list"
    ></div>

</div>


<script src="js/config.js"></script>


<script>

    let records = [];


    /* =========================================
       DEFAULT DATE
    ========================================= */

    function setDefaultDate() {

        const input =
            document.getElementById(
                "verificationDate"
            );

        const now =
            new Date();

        let year =
            now.getFullYear();

        let month =
            now.getMonth();

        if (
            now.getDate() < 15
        ) {

            month--;

            if (
                month < 0
            ) {

                month = 11;
                year--;

            }

        }

        const date =
            new Date(
                year,
                month,
                15
            );

        const yyyy =
            date.getFullYear();

        const mm =
            String(
                date.getMonth() + 1
            ).padStart(
                2,
                "0"
            );

        const dd =
            String(
                date.getDate()
            ).padStart(
                2,
                "0"
            );

        input.value =
            `${yyyy}-${mm}-${dd}`;

    }


    /* =========================================
       LOAD REPORT
    ========================================= */

    async function loadReport() {

        const loading =
            document.getElementById(
                "loading"
            );

        const errorBox =
            document.getElementById(
                "errorBox"
            );

        try {

            errorBox.style.display =
                "none";

            loading.style.display =
                "block";

            const date =
                document.getElementById(
                    "verificationDate"
                ).value;

            let endpoint =
                "/monthly-rewards/admin";

            if (date) {

                const month =
                    date.substring(
                        0,
                        7
                    );

                endpoint +=
                    `?month=${encodeURIComponent(
                        month
                    )}`;

            }

            const result =
                await api(
                    endpoint,
                    {},
                    true
                );

            if (
                !result ||
                !result.success
            ) {

                throw new Error(
                    result?.message ||
                    "Unable to load report"
                );

            }

            records =
                Array.isArray(
                    result.records
                )
                    ? result.records
                    : [];

            renderPeriod(
                records,
                result.month
            );

            renderRecords();

        }
        catch (error) {

            console.error(
                "ADMIN REWARD ERROR:",
                error
            );

            records = [];

            errorBox.textContent =
                error?.message ||
                "Unable to load report";

            errorBox.style.display =
                "block";

            renderRecords();

        }
        finally {

            loading.style.display =
                "none";

        }

    }


    /* =========================================
       PERIOD
    ========================================= */

    function renderPeriod(
        data,
        month
    ) {

        const box =
            document.getElementById(
                "periodBox"
            );

        if (
            Array.isArray(data) &&
            data.length &&
            data[0]?.periodLabel
        ) {

            box.innerHTML = `

                <strong>
                    Reward Period:
                </strong>

                ${escapeHtml(
                    data[0].periodLabel
                )}

                <br>

                <strong>
                    Verification Date:
                </strong>

                ${escapeHtml(
                    formatDate(
                        data[0].verificationDate
                    )
                )}

            `;

            return;

        }

        box.innerHTML = `

            <strong>
                Verification Month:
            </strong>

            ${escapeHtml(
                month || "No data"
            )}

        `;

    }


    /* =========================================
       RENDER RECORDS
    ========================================= */

    function renderRecords() {

        const list =
            document.getElementById(
                "recordList"
            );

        if (!records.length) {

            list.innerHTML = `

                <div class="empty-box">

                    <h3>
                        No reward records
                    </h3>

                    <p>
                        इस verification period में
                        कोई record नहीं मिला।
                    </p>

                </div>

            `;

            updateSummary();

            return;

        }

        list.innerHTML =
            records
                .map(
                    record =>
                        createRecordCard(
                            record
                        )
                )
                .join("");

        updateSummary();

    }


    /* =========================================
       SAFE CONTRACTOR NAME
       IMPORTANT:
       typeof null === "object"
       इसलिए null check जरूरी है।
    ========================================= */

    function getContractorName(
        contractor,
        fallback = "Contractor"
    ) {

        if (
            !contractor ||
            typeof contractor !== "object"
        ) {

            return fallback;

        }

        return (
            contractor.contractorName ||
            contractor.name ||
            contractor.companyName ||
            contractor.mobile ||
            fallback
        );

    }


    /* =========================================
       SAFE CONTRACTOR ID
    ========================================= */

    function getContractorId(
        contractor
    ) {

        if (!contractor) {

            return null;

        }

        if (
            typeof contractor === "string"
        ) {

            return contractor;

        }

        if (
            typeof contractor === "object"
        ) {

            return (
                contractor._id ||
                contractor.id ||
                null
            );

        }

        return null;

    }


    /* =========================================
       PUBLIC WORKER CHECK
    ========================================= */

    function isPublicWorkerRecord(
        record
    ) {

        return !record?.referredBy;

    }

   async function verifyWorkerStatus(
    id,
    status
) {

    const record =
        records.find(
            item =>
                String(item?._id) ===
                String(id)
        );

    if (!record) {

        alert(
            "Reward record not found."
        );

        return;
    }

    if (
        record.finalStatus !==
        "Pending"
    ) {

        alert(
            "This worker is already verified."
        );

        return;
    }

    const confirmText =
        status === "Working"

            ? "Verify this worker as WORKING?"
            : "Verify this worker as NOT WORKING?";

    if (!confirm(confirmText)) {

        return;
    }

    try {

        const result =
            await api(
                `/monthly-rewards/admin/${encodeURIComponent(
                    id
                )}/verify-status`,
                {
                    method: "PATCH",

                    body:
                        JSON.stringify({
                            status: status,
                            adminNote:
                                `Admin verified worker as ${status}.`
                        })
                },
                true
            );

        if (
            !result ||
            !result.success
        ) {

            throw new Error(
                result?.message ||
                "Unable to verify worker"
            );

        }

        alert(
            `Worker verified as ${status}.`
        );

        await loadReport();

    }
    catch (error) {

        console.error(
            "ADMIN VERIFY ERROR:",
            error
        );

        alert(
            error?.message ||
            "Unable to verify worker"
        );

    }

   }
    /* =========================================
       RECORD CARD
    ========================================= */

    function createRecordCard(
        record
    ) {

        record =
            record || {};

        const receiverStatus =
            record.receiverStatus ||
            "Pending";

        const referrerStatus =
            record.referrerStatus ||
            "Pending";

        const finalStatus =
            record.finalStatus ||
            "Pending";

        const referredBy =
            record.referredBy ||
            null;

        const referredTo =
            record.referredTo ||
            null;

        /*
         * IMPORTANT FIX
         *
         * Old code:
         *
         * typeof null === "object"
         *
         * and then:
         * referredBy.contractorName
         *
         * This caused:
         * Cannot read properties of null
         */

        const referrerName =
            getContractorName(
                referredBy,
                isPublicWorkerRecord(record)
                    ? "Admin / Public Worker"
                    : "Contractor"
            );

        const receiverName =
            getContractorName(
                referredTo,
                "Contractor"
            );


        const referrerLabel =
            isPublicWorkerRecord(record)
                ? "Reward Recipient"
                : "Referring Contractor";


        return `

            <div
                class="record-card"
                id="record-${escapeHtml(
                    record._id || ""
                )}"
            >

                <div class="record-top">

                    <div>

                        <div class="worker-name">

                            👷
                            ${escapeHtml(
                                record.workerName ||
                                "Unknown Worker"
                            )}

                        </div>

                        <div class="mobile">

                            📱
                            ${escapeHtml(
                                record.workerMobile ||
                                "Mobile not available"
                            )}

                        </div>

                    </div>


                    <div>

                        ${statusBadge(
                            receiverStatus
                        )}

                        ${statusBadge(
                            referrerStatus
                        )}

                        ${statusBadge(
                            finalStatus
                        )}

                    </div>

                </div>


                <div class="info-grid">

                    <div class="info-box">

                        <small>
                            ${escapeHtml(
                                referrerLabel
                            )}
                        </small>

                        <strong>
                            ${escapeHtml(
                                referrerName
                            )}
                        </strong>

                    </div>


                    <div class="info-box">

                        <small>
                            Receiving Contractor
                        </small>

                        <strong>
                            ${escapeHtml(
                                receiverName
                            )}
                        </strong>

                    </div>


                    <div class="info-box">

                        <small>
                            Joining Date
                        </small>

                        <strong>
                            ${escapeHtml(
                                formatDate(
                                    record.joiningDate
                                )
                            )}
                        </strong>

                    </div>


                    <div class="info-box">

                        <small>
                            Verification Date
                        </small>

                        <strong>
                            ${escapeHtml(
                                formatDate(
                                    record.verificationDate
                                )
                            )}
                        </strong>

                    </div>

                </div>


                <div class="info-grid">

                    <div class="info-box">

                        <small>
                            Receiver Note
                        </small>

                        ${
                            record.receiverNote
                                ? escapeHtml(
                                    record.receiverNote
                                )
                                : "—"
                        }

                    </div>


                    <div class="info-box">

                        <small>
                            Referrer Note
                        </small>

                        ${
                            record.referrerNote
                                ? escapeHtml(
                                    record.referrerNote
                                )
                                : "—"
                        }

                    </div>

                </div>

               ${
    finalStatus === "Pending" &&
    record.rewardStatus !== "Final"

        ? `

            <div class="reward-section">

                <strong>
                    🔍 Admin Verification
                </strong>

                <p class="decision-note">
                    Only Admin can verify this worker.
                </p>

                <button
                    type="button"
                    class="dispute-working-btn"
                    onclick="verifyWorkerStatus(
                        '${escapeJs(record._id)}',
                        'Working'
                    )"
                >
                    ✅ Working
                </button>

                <button
                    type="button"
                    class="dispute-not-working-btn"
                    onclick="verifyWorkerStatus(
                        '${escapeJs(record._id)}',
                        'Not Working'
                    )"
                >
                    ❌ Not Working
                </button>

            </div>

          `

        : ""

               }
                ${
                    finalStatus ===
                    "Disputed"

                        ? `

                            <div
                                class="reward-section"
                            >

                                <strong>
                                    ⚠️ Dispute requires review
                                </strong>

                                <p>
                                    Referrer and receiver
                                    verification do not have
                                    a final agreement.
                                </p>

                                <div
                                    class="decision-note"
                                >
                                    Admin decision required:
                                </div>


                                <button
                                    type="button"
                                    class="dispute-working-btn"
                                    onclick="resolveDispute(
                                        '${escapeJs(
                                            record._id
                                        )}',
                                        'Verified Working'
                                    )"
                                >
                                    ✅ Verify Working
                                </button>


                                <button
                                    type="button"
                                    class="dispute-not-working-btn"
                                    onclick="resolveDispute(
                                        '${escapeJs(
                                            record._id
                                        )}',
                                        'Verified Not Working'
                                    )"
                                >
                                    ❌ Verify Not Working
                                </button>

                            </div>

                          `

                        : ""

                }


                ${
                    finalStatus ===
                    "Verified Working" &&
                    record.rewardStatus !==
                    "Final"

                        ? `

                            <div
                                class="reward-section"
                            >

                                <strong>
                                    💰 Finalize Reward
                                </strong>

                                <br><br>

                                <label>

                                    Reward per worker:

                                    <br>

                                    <input
                                        type="number"
                                        min="0"
                                        step="1"
                                        class="reward-input"
                                        id="reward-${escapeHtml(
                                            record._id || ""
                                        )}"
                                        placeholder="Example: 500"
                                        value="${escapeHtml(
                                            record.rewardPerWorker ||
                                            ""
                                        )}"
                                    >

                                </label>


                                <br>


                                <button
                                    type="button"
                                    class="finalize-btn"
                                    onclick="finalizeReward(
                                        '${escapeJs(
                                            record._id
                                        )}'
                                    )"
                                >
                                    ✅ Approve & Finalize
                                </button>


                                <button
                                    type="button"
                                    class="reject-btn"
                                    onclick="rejectReward(
                                        '${escapeJs(
                                            record._id
                                        )}'
                                    )"
                                >
                                    ❌ Reject
                                </button>

                            </div>

                          `

                        : ""

                }


                ${
                    record.rewardStatus ===
                    "Final"

                        ? `

                            <div
                                class="finalized"
                            >

                                <strong>
                                    ✅ Reward Finalized
                                </strong>

                                <br><br>

                                Gross Reward:
                                <strong>
                                    ₹${formatMoney(
                                        record.rewardAmount
                                    )}
                                </strong>

                                <br>

                                Admin Commission:
                                <strong>
                                    ₹${formatMoney(
                                        record.adminCommission
                                    )}
                                </strong>

                                <br>

                                ${
                                    isPublicWorkerRecord(
                                        record
                                    )

                                        ? `
                                            Admin Reward:
                                            <strong>
                                                ₹${formatMoney(
                                                    record.rewardAmount
                                                )}
                                            </strong>
                                          `

                                        : `
                                            Contractor 90%:
                                            <strong>
                                                ₹${formatMoney(
                                                    record.contractorReward
                                                )}
                                            </strong>
                                          `

                                }

                                <br><br>

                                Reward Recipient:
                                <strong>
                                    ${escapeHtml(
                                        record.rewardRecipient ||
                                        (
                                            isPublicWorkerRecord(
                                                record
                                            )
                                                ? "Admin"
                                                : "Contractor"
                                        )
                                    )}
                                </strong>

                                <br>

                                Payment:
                                ${escapeHtml(
                                    record.paymentStatus ||
                                    "Not Started"
                                )}

                            </div>

                          `

                        : ""

                }

            </div>

        `;

    }


    /* =========================================
       STATUS BADGE
    ========================================= */

    function statusBadge(
        status
    ) {

        status =
            status ||
            "Pending";

        let className =
            "pending";

        if (
            status ===
            "Working"
        ) {

            className =
                "working";

        }
        else if (
            status ===
            "Not Working"
        ) {

            className =
                "not-working";

        }
        else if (
            status ===
            "Disputed"
        ) {

            className =
                "disputed";

        }
        else if (
            status ===
            "Verified Working"
        ) {

            className =
                "verified";

        }
        else if (
            status ===
            "Verified Not Working"
        ) {

            className =
                "not-working";

        }
        else if (
            status ===
            "Final"
        ) {

            className =
                "verified";

        }

        return `

            <span
                class="status ${className}"
            >
                ${escapeHtml(
                    status
                )}
            </span>

        `;

    }


    /* =========================================
       ADMIN DISPUTE RESOLUTION
    ========================================= */

    async function resolveDispute(
        id,
        decision
    ) {

        const record =
            records.find(
                item =>
                    String(
                        item?._id
                    ) ===
                    String(id)
            );

        if (!record) {

            alert(
                "Reward record not found."
            );

            return;

        }

        if (
            record.finalStatus !==
            "Disputed"
        ) {

            alert(
                "This record is no longer disputed."
            );

            return;

        }

        let confirmText;

        if (
            decision ===
            "Verified Working"
        ) {

            confirmText =
                "Admin decision:\n\n" +
                "Verify this worker as WORKING?\n\n" +
                "After this decision, the reward can be finalized.";

        }
        else {

            confirmText =
                "Admin decision:\n\n" +
                "Verify this worker as NOT WORKING?\n\n" +
                "The record will be scheduled for deletion after 1 hour.";

        }

        if (
            !confirm(
                confirmText
            )
        ) {

            return;

        }

        try {

            const result =
                await api(
                    `/monthly-rewards/admin/${encodeURIComponent(
                        id
                    )}/resolve`,
                    {
                        method: "PATCH",

                        body:
                            JSON.stringify({

                                finalStatus:
                                    decision,

                                note:
                                    decision ===
                                    "Verified Working"

                                        ? "Admin verified worker as Working."

                                        : "Admin verified worker as Not Working."

                            })
                    },
                    true
                );

            if (
                !result ||
                !result.success
            ) {

                throw new Error(
                    result?.message ||
                    "Unable to resolve dispute"
                );

            }

            if (
                decision ===
                "Verified Working"
            ) {

                alert(
                    "Dispute resolved: Worker verified as Working."
                );

            }
            else {

                alert(
                    "Dispute resolved: Worker verified as Not Working. Record will be deleted after 1 hour."
                );

            }

            await loadReport();

        }
        catch (error) {

            console.error(
                "RESOLVE DISPUTE ERROR:",
                error
            );

            alert(
                error?.message ||
                "Unable to resolve dispute"
            );

        }

    }


    /* =========================================
       FINALIZE REWARD
    ========================================= */

    async function finalizeReward(
        id
    ) {

        const record =
            records.find(
                item =>
                    String(
                        item?._id
                    ) ===
                    String(id)
            );

        if (!record) {

            alert(
                "Reward record not found."
            );

            return;

        }

        if (
            record.finalStatus !==
            "Verified Working"
        ) {

            alert(
                "Only Verified Working workers can receive reward."
            );

            return;

        }

        const input =
            document.getElementById(
                `reward-${id}`
            );

        const reward =
            Number(
                input?.value
            );

        if (
            !Number.isFinite(
                reward
            ) ||
            reward <= 0
        ) {

            alert(
                "Please enter a valid reward amount."
            );

            return;

        }

        const commission =
            reward *
            0.10;

        const contractorAmount =
            reward *
            0.90;

        const publicWorker =
            isPublicWorkerRecord(
                record
            );

        const confirmText =
            publicWorker

                ? (
                    `Finalize reward ₹${formatMoney(
                        reward
                    )}?\n\n` +

                    `Public Worker Reward → Admin\n` +

                    `Admin Commission 10% = ₹${formatMoney(
                        commission
                    )}\n\n` +

                    `Reward will be finalized for Admin.`
                )

                : (
                    `Finalize reward ₹${formatMoney(
                        reward
                    )}?\n\n` +

                    `Admin 10% = ₹${formatMoney(
                        commission
                    )}\n` +

                    `Contractor 90% = ₹${formatMoney(
                        contractorAmount
                    )}`
                );

        if (
            !confirm(
                confirmText
            )
        ) {

            return;

        }

        try {

            const result =
                await api(
                    `/monthly-rewards/admin/${encodeURIComponent(
                        id
                    )}/finalize`,
                    {
                        method: "PATCH",

                        body:
                            JSON.stringify({

                                rewardPerWorker:
                                    reward

                            })
                    },
                    true
                );

            if (
                !result ||
                !result.success
            ) {

                throw new Error(
                    result?.message ||
                    "Unable to finalize reward"
                );

            }

            alert(
                "Reward finalized successfully."
            );

            await loadReport();

        }
        catch (error) {

            console.error(
                "FINALIZE ERROR:",
                error
            );

            alert(
                error?.message ||
                "Unable to finalize reward"
            );

        }

    }


    /* =========================================
       REJECT
    ========================================= */

    async function rejectReward(
        id
    ) {

        const reason =
            prompt(
                "Enter rejection reason:"
            );

        if (
            reason === null
        ) {

            return;

        }

        try {

            const result =
                await api(
                    `/monthly-rewards/admin/${encodeURIComponent(
                        id
                    )}/reject`,
                    {
                        method: "PATCH",

                        body:
                            JSON.stringify({
                                note:
                                    reason
                            })
                    },
                    true
                );

            if (
                !result ||
                !result.success
            ) {

                throw new Error(
                    result?.message ||
                    "Unable to reject reward"
                );

            }

            alert(
                "Reward record rejected."
            );

            await loadReport();

        }
        catch (error) {

            console.error(
                "REJECT ERROR:",
                error
            );

            alert(
                error?.message ||
                "Unable to reject reward"
            );

        }

    }


    /* =========================================
       SUMMARY
    ========================================= */

    function updateSummary() {

        let working =
            0;

        let notWorking =
            0;

        let disputed =
            0;

        let finalized =
            0;

        let gross =
            0;

        let commission =
            0;

        let contractor =
            0;


        records.forEach(
            record => {

                record =
                    record || {};

                if (
                    record.finalStatus ===
                    "Verified Working"
                ) {

                    working++;

                }

                if (
                    record.finalStatus ===
                    "Verified Not Working"
                ) {

                    notWorking++;

                }

                if (
                    record.finalStatus ===
                    "Disputed"
                ) {

                    disputed++;

                }

                if (
                    record.rewardStatus ===
                    "Final"
                ) {

                    finalized++;

                }

                gross +=
                    Number(
                        record.rewardAmount ||
                        0
                    );

                commission +=
                    Number(
                        record.adminCommission ||
                        0
                    );

                /*
                 * Public worker:
                 * contractorReward normally 0.
                 *
                 * Contractor referral:
                 * contractorReward contains 90%.
                 */

                contractor +=
                    Number(
                        record.contractorReward ||
                        0
                    );

            }
        );


        document.getElementById(
            "totalWorkers"
        ).textContent =
            records.length;


        document.getElementById(
            "workingWorkers"
        ).textContent =
            working;


        document.getElementById(
            "notWorkingWorkers"
        ).textContent =
            notWorking;


        document.getElementById(
            "disputedWorkers"
        ).textContent =
            disputed;


        document.getElementById(
            "finalizedWorkers"
        ).textContent =
            finalized;


        document.getElementById(
            "grossReward"
        ).textContent =
            "₹" +
            formatMoney(
                gross
            );


        document.getElementById(
            "adminCommission"
        ).textContent =
            "₹" +
            formatMoney(
                commission
            );


        document.getElementById(
            "contractorReward"
        ).textContent =
            "₹" +
            formatMoney(
                contractor
            );

    }


    /* =========================================
       EXPORT CSV
    ========================================= */

    function exportCSV() {

        if (
            !records.length
        ) {

            alert(
                "No records to export."
            );

            return;

        }

        const rows = [

            [
                "Worker",
                "Mobile",
                "Reward Recipient",
                "Referring Contractor",
                "Receiving Contractor",
                "Joining Date",
                "Verification Date",
                "Receiver Status",
                "Referrer Status",
                "Final Status",
                "Reward",
                "Admin Commission",
                "Contractor Reward",
                "Payment Status"
            ]

        ];


        records.forEach(
            record => {

                record =
                    record || {};

                const referredBy =
                    record.referredBy ||
                    null;

                const referredTo =
                    record.referredTo ||
                    null;


                /*
                 * IMPORTANT FIX
                 * Null-safe object handling.
                 */

                const by =
                    getContractorName(
                        referredBy,
                        ""
                    );


                const to =
                    getContractorName(
                        referredTo,
                        ""
                    );


                const recipient =
                    record.rewardRecipient ||
                    (
                        !referredBy
                            ? "Admin"
                            : "Contractor"
                    );


                rows.push([

                    record.workerName ||
                    "",

                    record.workerMobile ||
                    "",

                    recipient,

                    by,

                    to,

                    formatDate(
                        record.joiningDate
                    ),

                    formatDate(
                        record.verificationDate
                    ),

                    record.receiverStatus ||
                    "",

                    record.referrerStatus ||
                    "",

                    record.finalStatus ||
                    "",

                    record.rewardAmount ||
                    0,

                    record.adminCommission ||
                    0,

                    record.contractorReward ||
                    0,

                    record.paymentStatus ||
                    ""

                ]);

            }
        );


        const csv =
            rows
                .map(
                    row =>
                        row
                            .map(
                                value =>
                                    `"${String(
                                        value ?? ""
                                    ).replace(
                                        /"/g,
                                        '""'
                                    )}"`
                            )
                            .join(",")
                )
                .join("\n");


        const blob =
            new Blob(
                [csv],
                {
                    type:
                        "text/csv;charset=utf-8;"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;

        link.download =
            "monthly-reward-report.csv";

        document.body.appendChild(
            link
        );

        link.click();

        link.remove();

        URL.revokeObjectURL(
            url
        );

    }


    /* =========================================
       DATE
    ========================================= */

    function formatDate(
        value
    ) {

        if (!value) {

            return "—";

        }

        try {

            const date =
                new Date(
                    value
                );

            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "—";

            }

            return date.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );

        }
        catch {

            return "—";

        }

    }


    /* =========================================
       MONEY
    ========================================= */

    function formatMoney(
        value
    ) {

        const number =
            Number(
                value || 0
            );

        if (
            !Number.isFinite(
                number
            )
        ) {

            return "0";

        }

        return number.toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }
        );

    }


    /* =========================================
       HTML ESCAPE
    ========================================= */

    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }


    /* =========================================
       JAVASCRIPT STRING ESCAPE
       Used inside onclick attributes.
    ========================================= */

    function escapeJs(
        value
    ) {

        return String(
            value ?? ""
        )
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /"/g,
            '\\"'
        )
        .replace(
            /\r/g,
            "\\r"
        )
        .replace(
            /\n/g,
            "\\n"
        );

    }


    /* =========================================
       EVENTS
    ========================================= */

    document
        .getElementById(
            "loadBtn"
        )
        .addEventListener(
            "click",
            loadReport
        );


    document
        .getElementById(
            "exportBtn"
        )
        .addEventListener(
            "click",
            exportCSV
        );


    /* =========================================
       START
    ========================================= */

    requireAdmin();

    setDefaultDate();

    loadReport();

</script>
