<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="style.css"></head><body><div class="container">
<div class="auth card"><h2>Contractor Registration</h2><div id="msg"></div>
<form id="form">
<input name="contractorName" placeholder="Contractor / Company Name" required>
<input name="ownerName" placeholder="Owner Name" required>
<input name="mobile" placeholder="10 Digit Mobile" required>
<input name="email" type="email" placeholder="Email">
<input name="password" type="password" placeholder="Password (minimum 8 characters)" required>
<input name="industrialArea" placeholder="Industrial Area (e.g. SIDCUL)">
<input name="city" placeholder="City">
<textarea name="address" placeholder="Address"></textarea>
<input name="gst" placeholder="GST (optional)"><input name="pan" placeholder="PAN (optional)"><input name="licenseNumber" placeholder="License Number (optional)">
<button>Register</button></form><p>Already registered? <a href="login.html">Login</a></p></div>
</div><script src="js/config.js"></script><script>
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const m=document.getElementById('msg');try{const r=await api('/contractors/register',{method:'POST',body:JSON.stringify(d)});m.className='notice success';m.textContent=r.message;e.target.reset()}catch(err){m.className='notice error';m.textContent=err.message}}
</script></body></html>
