<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Referrals</title><link rel="stylesheet" href="style.css"></head><body>

<!-- =========================================
     PROFESSIONAL HEADER
========================================= -->

<header class="top-header">

  <div class="header-container">


    <!-- BRAND -->

    <a href="dashboard.html" class="brand">

      <div class="brand-icon">
        🏠
      </div>

      <div class="brand-text">

        <h2>Contractor Job Network</h2>

        <span>
          Industrial Workforce Management
        </span>

      </div>

    </a>



    <!-- TOP NAVIGATION -->

    <nav class="top-nav">


      

      <a href="my-jobs.html"
         class="top-nav-item">

        💼

        <span>My Jobs</span>

      </a>


      <a href="notifications.html"
         class="top-nav-item">

        🔔

        <span>Notifications</span>

      </a>


    </nav>



    <!-- HAMBURGER MENU -->

    <button
      class="menu-btn"
      onclick="toggleMenu()"
      aria-label="Open Menu">

      ☰

    </button>


  </div>



  <!-- =========================================
       SIDE MENU
  ========================================= -->

  <div
    class="side-menu"
    id="sideMenu">


    <!-- MENU HEADER -->

    <div class="menu-header">


      <div>

        <h3>Menu</h3>

        <p>
          Contractor Panel
        </p>

      </div>


      <button
        class="close-menu"
        onclick="toggleMenu()">

        ✕

      </button>


    </div>



    <!-- MENU LINKS -->

    <a href="worker-search.html">

      🔎 Search Job for Worker

    </a>


    <a href="add-job.html">

      ➕ Add Job Requirement

    </a>


    <a href="referrals.html">

      🔄 Referrals

    </a>


    <a href="subscription.html">

      💳 Subscription Plan

    </a>


    <a href="profile.html">

      👤 My Profile

    </a>



    <div class="menu-divider"></div>



    <!-- LOGOUT -->

    <button
      class="side-logout"
      onclick="logout()">

      🚪 Logout

    </button>


  </div>



  <!-- BACKGROUND OVERLAY -->

  <div
    class="menu-overlay"
    id="menuOverlay"
    onclick="toggleMenu()">

  </div>


</header><div class="container">
<h1>Referrals</h1><div class="card"><h2>Received Referrals</h2><div id="received"></div></div><div class="card"><h2>Sent Referrals</h2><div id="sent"></div></div>
</div><script src="js/config.js"></script><script>


/* =========================================
   LOGIN CHECK
========================================= */

requireLogin();



/* =========================================
   HAMBURGER MENU
========================================= */

function toggleMenu(){

  const menu =
    document.getElementById("sideMenu");

  const overlay =
    document.getElementById("menuOverlay");


  menu.classList.toggle("show");

  overlay.classList.toggle("show");

}



/* =========================================
   LOAD DASHBOARD DATA
========================================= */

(async () => {

  try {


    /* ================================
       API REQUESTS
    ================================ */

    const me =
      await api("/contractors/me");


    const jobs =
      await api("/jobs/my");


    const sent =
      await api("/referrals/sent");


    const received =
      await api("/referrals/received");


    const notifications =
      await api("/notifications/");



    /* ================================
       CONTRACTOR DATA
    ================================ */

    const contractor =
      me.contractor;



    /* ================================
       WELCOME SECTION
    ================================ */

    welcome.innerHTML = `

      <h2>
        Welcome, ${contractor.contractorName || "Contractor"} 👋
      </h2>


      <p class="muted">

        📍
        ${contractor.industrialArea || ""}

        ${contractor.city || ""}

      </p>

    `;



    /* ================================
       UNREAD NOTIFICATIONS
    ================================ */

    const unreadCount =
      notifications.notifications
        .filter(notification =>
          !notification.isRead
        )
        .length;



    /* ================================
       STATISTICS
    ================================ */

    stats.innerHTML = `


      <div class="card">

        <div class="muted">

          💼 My Jobs

        </div>


        <div class="stat">

          ${jobs.jobs.length}

        </div>

      </div>



      <div class="card">

        <div class="muted">

          📤 Sent Referrals

        </div>


        <div class="stat">

          ${sent.referrals.length}

        </div>

      </div>



      <div class="card">

        <div class="muted">

          📥 Received Referrals

        </div>


        <div class="stat">

          ${received.referrals.length}

        </div>

      </div>



      <div class="card">

        <div class="muted">

          🔔 Unread Notifications

        </div>


        <div class="stat">

          ${unreadCount}

        </div>

      </div>


    `;


  }


  /* =========================================
     ERROR
  ========================================= */

  catch (error) {


    console.error(
      "Dashboard Error:",
      error
    );


    alert(
      error.message ||
      "Unable to load dashboard"
    );


  }


})();

</script>
<script>
requireLogin();const next={New:['Viewed','Accepted','Rejected'],Viewed:['Accepted','Rejected'],Accepted:['Contacted','Rejected'],Contacted:['Interview','Rejected'],Interview:['Selected','Rejected'],Selected:['Joined','Rejected']};
function row(r,received){let actions='';if(received&&next[r.status])actions=next[r.status].map(s=>`<button class="small" onclick="updateStatus('${r._id}','${s}')">${s}</button>`).join(' ');return `<div class="card"><h3>${r.workerName} <span class="badge">${r.status}</span></h3><p>Mobile: ${r.workerMobile} | Qualification: ${r.qualification||'-'} | Experience: ${r.experience||0}</p><p>Job: <b>${r.jobId?.jobTitle||'-'}</b> • ${r.jobId?.companyName||''}</p><p>${received?'From: '+(r.referredBy?.contractorName||''):'To: '+(r.referredTo?.contractorName||'')}</p><div class="actions">${actions}</div></div>`}
async function load(){try{const [a,b]=await Promise.all([api('/referrals/received'),api('/referrals/sent')]);received.innerHTML=a.referrals.length?a.referrals.map(r=>row(r,true)).join(''):'No received referrals';sent.innerHTML=b.referrals.length?b.referrals.map(r=>row(r,false)).join(''):'No sent referrals'}catch(e){alert(e.message)}}async function updateStatus(id,status){if(!confirm('Change status to '+status+'?'))return;try{await api('/referrals/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});load()}catch(e){alert(e.message)}}load();
</script></body></html>
