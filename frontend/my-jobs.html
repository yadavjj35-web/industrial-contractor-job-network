<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Jobs</title><link rel="stylesheet" href="style.css"></head><body>

<!-- =========================================

========================================= -->

<header class="top-header">

  <div class="header-container">


    <!-- BRAND -->

    <a href="dashboard.html" class="brand">

      <div class="brand-icon">

      </div>

      <div class="brand-text">

        <h2>Contractor Job Network</h2>

        <span>
          Industrial Workforce Management
        </span>

      </div>

    </a>



    <!-- TOP NAVIGATION -->

    <nav class="top-nav">


      

      <a href="my-jobs.html"
         class="top-nav-item">

        💼

        <span>My Jobs</span>

      </a>


      <a href="notifications.html"
         class="top-nav-item">

        🔔

        <span>Notifications</span>

      </a>


    </nav>



    <!-- HAMBURGER MENU -->

    <button
      class="menu-btn"
      onclick="toggleMenu()"
      aria-label="Open Menu">

      ☰

    </button>


  </div>



  <!-- =========================================

  ========================================= -->

  <div
    class="side-menu"
    id="sideMenu">


    <!-- MENU HEADER -->

    <div class="menu-header">


      <div>

        <h3>Menu</h3>

        <p>

      </div>


      <button
        class="close-menu"
        onclick="toggleMenu()">

        ✕

    <!-- MENU LINKS -->

    </a>

    </a>

    </a>

  </div>


</header><div class="container">
<h1>My Job Requirements</h1><div id="list"></div>
</div><script src="js/config.js"></script><script>


/* =========================================
   LOGIN CHECK
========================================= */

requireLogin();



/* =========================================
   HAMBURGER MENU
========================================= */

function toggleMenu(){

  const menu =
    document.getElementById("sideMenu");

  const overlay =
    document.getElementById("menuOverlay");


  menu.classList.toggle("show");

  overlay.classList.toggle("show");

}



/* =========================================
   LOAD DASHBOARD DATA
========================================= 

(async () => {

  try {


    /* ================================
       API REQUESTS
    ================================ *

    const me =
      await api("/contractors/me");


    const jobs =
      await api("/jobs/my");


    const sent =
      await api("/referrals/sent");


    const received =
      await api("/referrals/received");


    const notifications =
      await api("/notifications/");



    /* ================================
       CONTRACTOR DATA
    ================================ *

    const contractor =
      me.contractor;



    /* ================================
       WELCOME SECTION
    ================================ */

    welcome.innerHTML = `

      <h2>
        Welcome, ${contractor.contractorName || "Contractor"} 👋
      </h2>


      <p class="muted">

        📍
        ${contractor.industrialArea || ""}

        ${contractor.city || ""}

      </p>

    `;



    /* ================================
       UNREAD NOTIFICATIONS
    ================================ */

    const unreadCount =
      notifications.notifications
        .filter(notification =>
          !notification.isRead
        )
        .length;



    /* ================================
       STATISTICS
    ================================ */

    stats.innerHTML = `


      <div class="card">

        <div class="muted">

          💼 My Jobs

        </div>


        <div class="stat">

          ${jobs.jobs.length}

        </div>

      </div>



      <div class="card">

        <div class="muted">

          📤 Sent Referrals

        </div>


        <div class="stat">

          ${sent.referrals.length}

        </div>

      </div>



      <div class="card">

        <div class="muted">

          📥 Received Referrals

        </div>


        <div class="stat">

          ${received.referrals.length}

        </div>

      </div>



      <div class="card">

        <div class="muted">

          🔔 Unread Notifications

        </div>


        <div class="stat">

          ${unreadCount}

        </div>

      </div>


    `;


  }


  /* =========================================
     ERROR
  ========================================= */

  catch (error) {


    console.error(
      "Dashboard Error:",
      error
    );


    alert(
      error.message ||
      "Unable to load dashboard"
    );


  }


})();

</script>
     
<script>
async function closeJob(jobId) {
  if (!confirm("Are you sure you want to close this vacancy?")) {
    return;
  }

  try {
    const data = await api(`/jobs/${jobId}/close`, {
      method: "PUT"
    });

    alert(data.message || "Vacancy closed successfully");

    loadMyJobs();

  } catch (error) {
    alert(error.message || "Failed to close vacancy");
  }
}
requireLogin();async function load(){try{const r=await api('/jobs/my');list.innerHTML=r.jobs.length?r.jobs.map(j=>`<div class="card"><h3>${j.jobTitle}</h3><p><b>${j.companyName}</b> • ${j.companyLocation||''}</p><p>Required: ${j.workersRequired} | Filled: ${j.workersFilled} | Remaining: ${j.workersRemaining}</p><span class="badge">${j.status}</span><div class="actions" style="margin-top:12px">${j.status!=='Closed'?`<button class="red small" onclick="closeJob('${j._id}')">Close Job</button>`:''}</div></div>`).join(''):'<div class="card">No jobs added yet.</div>'}catch(e){list.innerHTML=e.message}}async function closeJob(id){if(!confirm('Close this job?'))return;try{await api('/jobs/'+id+'/close',{method:'PATCH'});load()}catch(e){alert(e.message)}}load();
</script></body></html>
