<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Jobs</title><link rel="stylesheet" href="style.css"></head><body>
<div class="nav"><div class="brand">🏭 Contractor Job Network</div>
<div class="nav-links">
<a href="dashboard.html">Dashboard</a><a href="worker-search.html">Search Worker Job</a>

</div></div><div class="container">
<h1>My Job Requirements</h1><div id="list"></div>
</div><script src="js/config.js"></script><script>
requireLogin();async function load(){try{const r=await api('/jobs/my');list.innerHTML=r.jobs.length?r.jobs.map(j=>`<div class="card"><h3>${j.jobTitle}</h3><p><b>${j.companyName}</b> • ${j.companyLocation||''}</p><p>Required: ${j.workersRequired} | Filled: ${j.workersFilled} | Remaining: ${j.workersRemaining}</p><span class="badge">${j.status}</span><div class="actions" style="margin-top:12px">${j.status!=='Closed'?`<button class="red small" onclick="closeJob('${j._id}')">Close Job</button>`:''}</div></div>`).join(''):'<div class="card">No jobs added yet.</div>'}catch(e){list.innerHTML=e.message}}async function closeJob(id){if(!confirm('Close this job?'))return;try{await api('/jobs/'+id+'/close',{method:'PATCH'});load()}catch(e){alert(e.message)}}load();
</script></body></html>
