<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile</title><link rel="stylesheet" href="style.css"></head><body>

<!-- =========================================
     PROFESSIONAL HEADER
========================================= -->

<header class="top-header">

  <div class="header-container">


    <!-- BRAND -->

    <a href="dashboard.html" class="brand">

      <div class="brand-icon">
        🏠
      </div>

      <div class="brand-text">

        <h2>Contractor Job Network</h2>

        <span>
          Industrial Workforce Management
        </span>

      </div>

    </a>



    <!-- TOP NAVIGATION -->

    <nav class="top-nav">


      

      <a href="my-jobs.html"
         class="top-nav-item">

        💼

        <span>My Jobs</span>

      </a>


      <a href="notifications.html"
         class="top-nav-item">

        🔔

        <span>Notifications</span>

      </a>


    </nav>



    <!-- HAMBURGER MENU -->

    <button
      class="menu-btn"
      onclick="toggleMenu()"
      aria-label="Open Menu">

      ☰

    </button>


  </div>



  <!-- =========================================
       SIDE MENU
  ========================================= -->

  <div
    class="side-menu"
    id="sideMenu">


    <!-- MENU HEADER -->

    <div class="menu-header">


      <div>

        <h3>Menu</h3>

        <p>
          Contractor Panel
        </p>

      </div>


      <button
        class="close-menu"
        onclick="toggleMenu()">

        ✕

      </button>


    </div>



    <!-- MENU LINKS -->

    <a href="worker-search.html">

      🔎 Search Job for Worker

    </a>


    <a href="add-job.html">

      ➕ Add Job Requirement

    </a>


    <a href="referrals.html">

      🔄 Referrals

    </a>


    <a href="subscription.html">

      💳 Subscription Plan

    </a>


    <a href="profile.html">

      👤 My Profile

    </a>



    <div class="menu-divider"></div>



    <!-- LOGOUT -->

    <button
      class="side-logout"
      onclick="logout()">

      🚪 Logout

    </button>


  </div>



  <!-- BACKGROUND OVERLAY -->

  <div
    class="menu-overlay"
    id="menuOverlay"
    onclick="toggleMenu()">

  </div>


</header><div class="container">
<div class="card"><h1>My Profile</h1><div id="msg"></div><form id="form"></form></div>
</div><script src="js/config.js"></script><script>


/* =========================================
   LOGIN CHECK
========================================= */

requireLogin();



/* =========================================
   HAMBURGER MENU
========================================= */

function toggleMenu(){

  const menu =
    document.getElementById("sideMenu");

  const overlay =
    document.getElementById("menuOverlay");


  menu.classList.toggle("show");

  overlay.classList.toggle("show");

}



/* =========================================
   LOAD DASHBOARD DATA
========================================= */

(async () => {

  try {


    /* ================================
       API REQUESTS
    ================================ */

    const me =
      await api("/contractors/me");


    const jobs =
      await api("/jobs/my");


    const sent =
      await api("/referrals/sent");


    const received =
      await api("/referrals/received");


    const notifications =
      await api("/notifications/");



    /* ================================
       CONTRACTOR DATA
    ================================ */

    const contractor =
      me.contractor;



    /* ================================
       WELCOME SECTION
    ================================ */

    welcome.innerHTML = `

      <h2>
        Welcome, ${contractor.contractorName || "Contractor"} 👋
      </h2>


      <p class="muted">

        📍
        ${contractor.industrialArea || ""}

        ${contractor.city || ""}

      </p>

    `;



    /* ================================
       UNREAD NOTIFICATIONS
    ================================ */

    const unreadCount =
      notifications.notifications
        .filter(notification =>
          !notification.isRead
        )
        .length;



    /* ================================
       STATISTICS
    ================================ */

    stats.innerHTML = `


      <div class="card">

        <div class="muted">

          💼 My Jobs

        </div>


        <div class="stat">

          ${jobs.jobs.length}

        </div>

      </div>



      <div class="card">

        <div class="muted">

          📤 Sent Referrals

        </div>


        <div class="stat">

          ${sent.referrals.length}

        </div>

      </div>



      <div class="card">

        <div class="muted">

          📥 Received Referrals

        </div>


        <div class="stat">

          ${received.referrals.length}

        </div>

      </div>



      <div class="card">

        <div class="muted">

          🔔 Unread Notifications

        </div>


        <div class="stat">

          ${unreadCount}

        </div>

      </div>


    `;


  }


  /* =========================================
     ERROR
  ========================================= */

  catch (error) {


    console.error(
      "Dashboard Error:",
      error
    );


    alert(
      error.message ||
      "Unable to load dashboard"
    );


  }


})();

</script>
<script>
requireLogin();async function load(){const r=await api('/contractors/me');const c=r.contractor;form.innerHTML=['contractorName','ownerName','email','industrialArea','city','address','gst','pan','licenseNumber'].map(k=>`<label>${k}</label>${k==='address'?`<textarea name="${k}">${c[k]||''}</textarea>`:`<input name="${k}" value="${c[k]||''}">`}`).join('')+'<button>Save Profile</button>';form.onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(form));const x=await api('/contractors/profile',{method:'PUT',body:JSON.stringify(d)});msg.className='notice success';msg.textContent=x.message}catch(err){msg.className='notice error';msg.textContent=err.message}}}load();
</script></body></html>
