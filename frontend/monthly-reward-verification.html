<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Monthly Worker Verification</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>

        .reward-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .reward-header {
            margin-bottom: 20px;
        }

        .reward-header h1 {
            margin-bottom: 6px;
        }

        .period-box {
            background: #f5f7fa;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }

        .summary-box {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }

        .summary-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 15px;
        }

        .summary-card strong {
            display: block;
            font-size: 24px;
            margin-top: 5px;
        }

        .worker-list {
            display: grid;
            gap: 15px;
        }

        .worker-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .worker-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .worker-name {
            font-size: 19px;
            font-weight: 700;
        }

        .worker-mobile {
            color: #555;
            margin-top: 5px;
        }

        .contractor-info {
            margin-top: 12px;
            padding: 10px;
            background: #f7f7f7;
            border-radius: 8px;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-working {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-not-working {
            background: #f8d7da;
            color: #842029;
        }

        .status-final {
            background: #e0cffc;
            color: #4c1d95;
        }

        .status-paid {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-payment-pending {
            background: #fff3cd;
            color: #856404;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .working-btn,
        .not-working-btn {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            cursor: pointer;
            font-weight: 600;
        }

        .working-btn {
            background: #198754;
            color: white;
        }

        .not-working-btn {
            background: #dc3545;
            color: white;
        }

        .working-btn:disabled,
        .not-working-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =========================================
           PAY REWARD
        ========================================= */

        .pay-reward-btn {
            border: none;
            border-radius: 9px;
            padding: 12px 20px;
            background: #6F2DBD;
            color: white;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            width: 100%;
            margin-top: 12px;
        }

        .pay-reward-btn:hover {
            opacity: 0.92;
        }

        .pay-reward-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .reward-payment-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            background: #f8f5ff;
            border: 1px solid #ddd0f5;
        }

        .reward-payment-box strong {
            display: block;
            margin-bottom: 5px;
        }

        .reward-amount {
            font-size: 23px;
            font-weight: 800;
            color: #6F2DBD;
        }

        .payment-message {
            margin-top: 8px;
            font-size: 13px;
            color: #555;
        }

        .note-input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-top: 12px;
            min-height: 70px;
            resize: vertical;
        }

        .empty-box {
            text-align: center;
            padding: 40px 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

        .error-message {
            background: #f8d7da;
            color: #842029;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .success-message {
            background: #d1e7dd;
            color: #0f5132;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {

            .reward-page {
                padding: 12px;
            }

            .worker-card {
                padding: 14px;
            }

            .working-btn,
            .not-working-btn {
                width: 100%;
            }

            .pay-reward-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>

<div class="reward-page">

    <div class="reward-header">

        <h1>
            📋 Monthly Worker Verification
        </h1>

        <p>
            अपने referred workers की current working स्थिति verify करें।
        </p>

        <div
            class="period-box"
            id="periodBox"
        >
            Loading period...
        </div>

    </div>


    <div
        id="errorBox"
        style="display:none;"
        class="error-message"
    ></div>


    <div
        id="successBox"
        style="display:none;"
        class="success-message"
    ></div>


    <div
        class="summary-box"
        id="summaryBox"
    >

        <div class="summary-card">
            Total Workers
            <strong id="totalWorkers">
                0
            </strong>
        </div>

        <div class="summary-card">
            Pending
            <strong id="pendingWorkers">
                0
            </strong>
        </div>

        <div class="summary-card">
            Working
            <strong id="workingWorkers">
                0
            </strong>
        </div>

        <div class="summary-card">
            Not Working
            <strong id="notWorkingWorkers">
                0
            </strong>
        </div>

    </div>


    <div
        id="loading"
        class="loading"
    >
        Workers loading...
    </div>


    <div
        id="workerList"
        class="worker-list"
    ></div>

</div>


<script src="js/config.js"></script>


<script>

    let records = [];


    /* =========================================
       LOAD RECORDS
    ========================================= */

    async function loadWorkers() {

        const loading =
            document.getElementById(
                "loading"
            );

        const list =
            document.getElementById(
                "workerList"
            );

        const errorBox =
            document.getElementById(
                "errorBox"
            );

        try {

            loading.style.display =
                "block";

            errorBox.style.display =
                "none";

            const result =
                await api(
                    "/monthly-rewards/receiver"
                );


            if (
                !result ||
                !result.success
            ) {

                throw new Error(
                    result?.message ||
                    "Unable to load workers"
                );

            }


            records =
                Array.isArray(
                    result.records
                )
                    ? result.records
                    : [];


            renderPeriod(
                result.period,
                result.month
            );


            renderWorkers();

        }
        catch (error) {

            console.error(
                "LOAD REWARD ERROR:",
                error
            );


            errorBox.textContent =
                error.message ||
                "Unable to load verification data";


            errorBox.style.display =
                "block";

        }
        finally {

            loading.style.display =
                "none";

        }

    }


    /* =========================================
       PERIOD
    ========================================= */

    function renderPeriod(
        period,
        month
    ) {

        const box =
            document.getElementById(
                "periodBox"
            );


        if (
            period &&
            period.periodLabel
        ) {

            box.innerHTML = `
                <strong>Reward Period:</strong>
                ${escapeHtml(
                    period.periodLabel
                )}
                <br>
                <strong>Verification:</strong>
                ${formatDate(
                    period.verificationDate
                )}
            `;

            return;

        }


        if (
            records.length &&
            records[0].periodLabel
        ) {

            box.innerHTML = `
                <strong>Reward Period:</strong>
                ${escapeHtml(
                    records[0].periodLabel
                )}
                <br>
                <strong>Verification:</strong>
                15th
            `;

            return;

        }


        box.innerHTML = `
            <strong>Current Verification:</strong>
            ${escapeHtml(
                month || ""
            )}
        `;

    }


    /* =========================================
       RENDER WORKERS
    ========================================= */

    function renderWorkers() {

        const list =
            document.getElementById(
                "workerList"
            );


        if (!records.length) {

            list.innerHTML = `
                <div class="empty-box">

                    <h3>
                        No workers available
                    </h3>

                    <p>
                        इस verification period में
                        कोई worker उपलब्ध नहीं है।
                    </p>

                </div>
            `;

            updateSummary();

            return;

        }


        list.innerHTML =
            records
                .map(
                    record =>
                        createWorkerCard(
                            record
                        )
                )
                .join("");


        updateSummary();

    }


    /* =========================================
       WORKER CARD
    ========================================= */

    function createWorkerCard(
        record
    ) {

        const status =
            record.receiverStatus ||
            "Pending";


        let statusClass =
            "status-pending";


        if (
            status === "Working"
        ) {

            statusClass =
                "status-working";

        }


        if (
            status === "Not Working"
        ) {

            statusClass =
                "status-not-working";

        }


        const referredBy =
            record.referredBy;


        const contractorName =
            typeof referredBy === "object"
                ? (
                    referredBy.contractorName ||
                    "Contractor"
                )
                : "Contractor";


        const disabled =
            status !== "Pending"
                ? "disabled"
                : "";


        /* =====================================
           PAYMENT INFORMATION
        ===================================== */

        const rewardStatus =
            record.rewardStatus ||
            "Pending";


        const paymentStatus =
            record.paymentStatus ||
            "Not Started";


        const walletCreditStatus =
            record.walletCreditStatus ||
            "Not Started";


        const contractorReward =
            Number(
                record.contractorReward ||
                0
            );


        let paymentHtml = "";


        /*
         * Reward finalized + payment not done
         */

        if (
            rewardStatus === "Final" &&
            record.adminApprovalStatus === "Approved" &&
            paymentStatus !== "Paid"
        ) {

            paymentHtml = `

                <div class="reward-payment-box">

                    <strong>
                        💰 Reward Payment
                    </strong>

                    <div class="reward-amount">
                        ₹${contractorReward.toFixed(2)}
                    </div>

                    <div class="payment-message">
                        Admin ने reward approve कर दिया है।
                        कृपया reward payment complete करें।
                    </div>

                    <button
                        type="button"
                        class="pay-reward-btn"
                        data-id="${escapeHtml(
                            record._id
                        )}"
                        onclick="payReward(
                            '${escapeHtml(
                                record._id
                            )}'
                        )"
                    >
                        💳 Pay Reward ₹${contractorReward.toFixed(2)}
                    </button>

                </div>

            `;

        }


        /*
         * Payment successful but wallet processing
         */

        else if (
            paymentStatus === "Paid" &&
            walletCreditStatus !== "Credited"
        ) {

            paymentHtml = `

                <div class="reward-payment-box">

                    <strong>
                        ⏳ Payment Received
                    </strong>

                    <div class="reward-amount">
                        ₹${contractorReward.toFixed(2)}
                    </div>

                    <div class="payment-message">
                        Payment successful.
                        Wallet credit processing...
                    </div>

                </div>

            `;

        }


        /*
         * Payment + wallet complete
         */

        else if (
            paymentStatus === "Paid" &&
            walletCreditStatus === "Credited"
        ) {

            paymentHtml = `

                <div class="reward-payment-box">

                    <strong>
                        ✅ Reward Paid
                    </strong>

                    <div class="reward-amount">
                        ₹${contractorReward.toFixed(2)}
                    </div>

                    <div class="payment-message">
                        Payment successful और reward
                        referring contractor के wallet में
                        credit हो चुका है।
                    </div>

                </div>

            `;

        }


        return `

            <div
                class="worker-card"
                id="worker-${record._id}"
            >

                <div class="worker-top">

                    <div>

                        <div class="worker-name">
                            ${escapeHtml(
                                record.workerName
                            )}
                        </div>

                        <div class="worker-mobile">
                            📱 ${escapeHtml(
                                record.workerMobile
                            )}
                        </div>

                    </div>

                    <div>

                        <span
                            class="status ${statusClass}"
                        >
                            ${escapeHtml(
                                status
                            )}
                        </span>

                    </div>

                </div>


                <div class="contractor-info">

                    <strong>
                        Referred By:
                    </strong>

                    ${escapeHtml(
                        contractorName
                    )}

                </div>


                ${
                    record.joiningDate
                        ? `
                            <p>
                                📅 Joined:
                                ${formatDate(
                                    record.joiningDate
                                )}
                            </p>
                          `
                        : ""
                }


                ${
                    rewardStatus === "Final"
                        ? `
                            <div
                                style="
                                    margin-top:12px;
                                    padding:10px;
                                    background:#f8f5ff;
                                    border-radius:8px;
                                "
                            >
                                <strong>
                                    Reward Status:
                                </strong>

                                <span class="status status-final">
                                    Final
                                </span>

                                <br><br>

                                <strong>
                                    Gross Reward:
                                </strong>

                                ₹${Number(
                                    record.rewardAmount || 0
                                ).toFixed(2)}

                                <br>

                                <strong>
                                    Admin Commission:
                                </strong>

                                ₹${Number(
                                    record.adminCommission || 0
                                ).toFixed(2)}

                                <br>

                                <strong>
                                    Your Payment:
                                </strong>

                                ₹${contractorReward.toFixed(2)}
                            </div>
                          `
                        : ""
                }


                <textarea
                    class="note-input"
                    id="note-${record._id}"
                    placeholder="Optional note..."
                    ${disabled}
                >${escapeHtml(
                    record.receiverNote || ""
                )}</textarea>


                <div class="action-buttons">

                    <button
                        type="button"
                        class="working-btn"
                        onclick="updateStatus(
                            '${record._id}',
                            'Working'
                        )"
                        ${disabled}
                    >
                        ✅ Working
                    </button>


                    <button
                        type="button"
                        class="not-working-btn"
                        onclick="updateStatus(
                            '${record._id}',
                            'Not Working'
                        )"
                        ${disabled}
                    >
                        ❌ Not Working
                    </button>

                </div>


                ${paymentHtml}

            </div>

        `;

    }


    /* =========================================
       UPDATE STATUS
    ========================================= */

    async function updateStatus(
        id,
        status
    ) {

        const record =
            records.find(
                item =>
                    String(item._id) ===
                    String(id)
            );


        if (!record) {

            alert(
                "Worker record not found"
            );

            return;

        }


        if (
            record.receiverStatus !==
            "Pending"
        ) {

            alert(
                "This worker has already been verified."
            );

            return;

        }


        const noteElement =
            document.getElementById(
                `note-${id}`
            );


        const note =
            noteElement
                ? noteElement.value.trim()
                : "";


        const confirmation =
            status === "Working"

                ? "Is this worker currently working?"

                : "Is this worker currently NOT working?";


        if (
            !confirm(
                confirmation
            )
        ) {

            return;

        }


        try {

            const result =
                await api(
                    `/monthly-rewards/${id}/receiver-status`,
                    {
                        method: "PATCH",

                        body:
                            JSON.stringify({
                                status,
                                note
                            })
                    }
                );


            if (
                !result ||
                !result.success
            ) {

                throw new Error(
                    result?.message ||
                    "Unable to update status"
                );

            }


            alert(
                status === "Working"
                    ? "Worker marked as Working."
                    : "Worker marked as Not Working."
            );


            await loadWorkers();

        }
        catch (error) {

            console.error(
                "STATUS UPDATE ERROR:",
                error
            );


            alert(
                error.message ||
                "Unable to update worker status"
            );

        }

    }


    /* =========================================
       PAY REWARD
    ========================================= */

    async function payReward(
        rewardId
    ) {

        if (
            !rewardId
        ) {

            alert(
                "Reward ID missing"
            );

            return;

        }


        const record =
            records.find(
                item =>
                    String(item._id) ===
                    String(rewardId)
            );


        if (!record) {

            alert(
                "Reward record not found"
            );

            return;

        }


        if (
            record.rewardStatus !==
            "Final"
        ) {

            alert(
                "Reward has not been finalized by Admin."
            );

            return;

        }


        if (
            record.adminApprovalStatus !==
            "Approved"
        ) {

            alert(
                "Reward is not approved by Admin."
            );

            return;

        }


        if (
            record.paymentStatus ===
            "Paid"
        ) {

            alert(
                "This reward has already been paid."
            );

            return;

        }


        const contractorReward =
            Number(
                record.contractorReward ||
                0
            );


        if (
            !Number.isFinite(
                contractorReward
            ) ||
            contractorReward <= 0
        ) {

            alert(
                "Invalid reward amount."
            );

            return;

        }


        const button =
            document.querySelector(
                `.pay-reward-btn[data-id="${rewardId}"]`
            );


        if (button) {

            button.disabled =
                true;

            button.textContent =
                "⏳ Starting Payment...";

        }


        try {

            /* =====================================
               CREATE RAZORPAY ORDER
            ===================================== */

            const result =
                await api(
                    "/wallet/reward-payment/order",
                    {
                        method: "POST",

                        body:
                            JSON.stringify({
                                rewardId
                            })
                    }
                );


            if (
                !result ||
                !result.success
            ) {

                throw new Error(
                    result?.message ||
                    "Unable to create payment"
                );

            }


            if (
                !result.key ||
                !result.order ||
                !result.order.id
            ) {

                throw new Error(
                    "Invalid payment order received from server"
                );

            }


            /* =====================================
               RAZORPAY OPTIONS
            ===================================== */

            const options = {

                key:
                    result.key,

                amount:
                    result.order.amount,

                currency:
                    result.order.currency ||
                    "INR",

                name:
                    "ContractorHub",

                description:
                    "Monthly Referral Reward",

                order_id:
                    result.order.id,

                prefill: {

                    name:
                        record.referredTo?.contractorName ||
                        "",

                    contact:
                        record.referredTo?.mobile ||
                        ""

                },

                notes: {

                    rewardId:
                        String(
                            rewardId
                        ),

                    workerName:
                        String(
                            record.workerName ||
                            ""
                        )

                },

                theme: {

                    color:
                        "#6F2DBD"

                },


                /* =================================
                   PAYMENT SUCCESS
                ================================= */

                handler:
                    async function(
                        response
                    ) {

                        try {

                            const verify =
                                await api(
                                    "/wallet/reward-payment/verify",
                                    {
                                        method: "POST",

                                        body:
                                            JSON.stringify({

                                                rewardId,

                                                razorpay_order_id:
                                                    response
                                                        .razorpay_order_id,

                                                razorpay_payment_id:
                                                    response
                                                        .razorpay_payment_id,

                                                razorpay_signature:
                                                    response
                                                        .razorpay_signature

                                            })
                                    }
                                );


                            if (
                                !verify ||
                                !verify.success
                            ) {

                                throw new Error(
                                    verify?.message ||
                                    "Payment verification failed"
                                );

                            }


                            showSuccess(
                                "Payment successful. Reward wallet mein credit ho gaya."
                            );


                            await loadWorkers();

                        }
                        catch(error) {

                            console.error(
                                "PAYMENT VERIFY ERROR:",
                                error
                            );


                            showError(
                                error.message ||
                                "Payment verification failed"
                            );

                        }

                    }

            };


            /* =====================================
               OPEN RAZORPAY
            ===================================== */

            if (
                typeof Razorpay !==
                "function"
            ) {

                throw new Error(
                    "Razorpay Checkout is not loaded"
                );

            }


            const razorpay =
                new Razorpay(
                    options
                );


            razorpay.on(
                "payment.failed",
                function(
                    response
                ) {

                    console.error(
                        "RAZORPAY PAYMENT FAILED:",
                        response
                    );


                    showError(
                        response?.error?.description ||
                        "Payment failed"
                    );


                    if (button) {

                        button.disabled =
                            false;

                        button.textContent =
                            `💳 Pay Reward ₹${contractorReward.toFixed(2)}`;

                    }

                }
            );


            razorpay.open();


        }
        catch(error) {

            console.error(
                "PAY REWARD ERROR:",
                error
            );


            showError(
                error.message ||
                "Unable to start payment"
            );


            if (button) {

                button.disabled =
                    false;

                button.textContent =
                    `💳 Pay Reward ₹${contractorReward.toFixed(2)}`;

            }

        }

    }


    /* =========================================
       SUMMARY
    ========================================= */

    function updateSummary() {

        let pending =
            0;

        let working =
            0;

        let notWorking =
            0;


        records.forEach(
            record => {

                if (
                    record.receiverStatus ===
                    "Working"
                ) {

                    working++;

                }
                else if (
                    record.receiverStatus ===
                    "Not Working"
                ) {

                    notWorking++;

                }
                else {

                    pending++;

                }

            }
        );


        document.getElementById(
            "totalWorkers"
        ).textContent =
            records.length;


        document.getElementById(
            "pendingWorkers"
        ).textContent =
            pending;


        document.getElementById(
            "workingWorkers"
        ).textContent =
            working;


        document.getElementById(
            "notWorkingWorkers"
        ).textContent =
            notWorking;

    }


    /* =========================================
       ERROR MESSAGE
    ========================================= */

    function showError(
        message
    ) {

        const box =
            document.getElementById(
                "errorBox"
            );


        box.textContent =
            message ||
            "Something went wrong";


        box.style.display =
            "block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    /* =========================================
       SUCCESS MESSAGE
    ========================================= */

    function showSuccess(
        message
    ) {

        const box =
            document.getElementById(
                "successBox"
            );


        box.textContent =
            message ||
            "Success";


        box.style.display =
            "block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    /* =========================================
       DATE
    ========================================= */

    function formatDate(
        value
    ) {

        if (!value) {

            return "";

        }


        try {

            const date =
                new Date(
                    value
                );


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "";

            }


            return date.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );

        }
        catch {

            return "";

        }

    }


    /* =========================================
       HTML ESCAPE
    ========================================= */

    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }


    /* =========================================
       START
    ========================================= */

    requireLogin();

    loadWorkers();

</script>
