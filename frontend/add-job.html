<!doctype html>
<html>

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1">

  <title>Add Job</title>

  <link
    rel="stylesheet"
    href="style.css">

</head>

<body>


<!-- =========================================
     PROFESSIONAL HEADER
========================================= -->

<header class="top-header">

  <div class="header-container">


    <!-- BRAND -->

    <a
      href="dashboard.html"
      class="brand">

      <div class="brand-icon">
        🏠
      </div>

      <div class="brand-text">

        <h2>
          Contractor Job Network
        </h2>

        <span>
          Industrial Workforce Management
        </span>

      </div>

    </a>


    <!-- TOP NAVIGATION -->

    <nav class="top-nav">

      <a
        href="my-jobs.html"
        class="top-nav-item">

        💼
        <span>My Jobs</span>

      </a>


      <a
        href="notifications.html"
        class="top-nav-item">

        🔔
        <span>Notifications</span>

      </a>

    </nav>


    <!-- HAMBURGER MENU -->

    <button
      type="button"
      class="menu-btn"
      onclick="toggleMenu()"
      aria-label="Open Menu">

      ☰

    </button>

  </div>


  <!-- =========================================
       SIDE MENU
  ========================================= -->

  <div
    class="side-menu"
    id="sideMenu">


    <!-- MENU HEADER -->

    <div class="menu-header">

      <div>

        <h3>
          Menu
        </h3>

        <p>
          Contractor Panel
        </p>

      </div>


      <button
        type="button"
        class="close-menu"
        onclick="toggleMenu()"
        aria-label="Close Menu">

        ✕

      </button>

    </div>


    <!-- MENU LINKS -->

    <a href="dashboard.html">
      🏠 Dashboard
    </a>


    <a href="worker-search.html">
      🔎 Search Job for Worker
    </a>


    <a href="add-job.html">
      ➕ Add Job Requirement
    </a>


    <a href="referrals.html">
      🔄 Referrals
    </a>


    <a href="my-jobs.html">
      💼 My Jobs
    </a>


    <a href="notifications.html">
      🔔 Notifications
    </a>


    <a href="subscription.html">
      💳 Subscription Plan
    </a>


    <a href="profile.html">
      👤 My Profile
    </a>


    <div class="menu-divider"></div>


    <!-- LOGOUT -->

    <button
      type="button"
      class="side-logout"
      onclick="logout()">

      🚪 Logout

    </button>

  </div>


  <!-- BACKGROUND OVERLAY -->

  <div
    class="menu-overlay"
    id="menuOverlay"
    onclick="toggleMenu()">

  </div>

</header>



<!-- =========================================
     MAIN CONTENT
========================================= -->

<div class="container">

  <div class="card">

    <h1>
      Add Job Requirement
    </h1>


    <!-- MESSAGE -->

    <div id="msg"></div>


    <!-- =====================================
         JOB FORM
    ====================================== -->

    <form
      id="form"
      class="grid">


      <!-- COMPANY -->

      <input
        name="companyName"
        placeholder="Company Name"
        required>


      <input
        name="companyLocation"
        placeholder="Company Location">


      <input
        name="plantUnit"
        placeholder="Plant / Unit">


      <!-- JOB -->

      <input
        name="jobTitle"
        placeholder="Job Title"
        required>


      <input
        name="department"
        placeholder="Department">


      <select name="jobType">

        <option value="Full Time">
          Full Time
        </option>

        <option value="Contract">
          Contract
        </option>

        <option value="Temporary">
          Temporary
        </option>

      </select>


      <!-- WORKERS -->

      <input
        name="workersRequired"
        type="number"
        min="1"
        placeholder="Workers Required"
        required>


      <!-- REQUIREMENTS -->

      <input
        name="qualification"
        placeholder="Qualification">


      <input
        name="trade"
        placeholder="Trade">


      <input
        name="experienceMin"
        type="number"
        min="0"
        placeholder="Min Experience">


      <input
        name="experienceMax"
        type="number"
        min="0"
        placeholder="Max Experience">


      <input
        name="skills"
        placeholder="Skills comma separated">


      <!-- SALARY -->

      <input
        name="salaryMin"
        type="number"
        min="0"
        placeholder="Minimum Salary">


      <input
        name="salaryMax"
        type="number"
        min="0"
        placeholder="Maximum Salary">


      <!-- LOCATION -->

      <input
        name="industrialArea"
        placeholder="Industrial Area">


      <!-- DATES -->

      <input
        name="joiningDate"
        type="date">


      <input
        name="lastDate"
        type="date">


      <!-- BENEFITS -->

      <textarea
        name="benefits"
        placeholder="Benefits"></textarea>


      <!-- SUBMIT -->

      <button
        type="submit"
        class="orange">

        Save Requirement

      </button>


    </form>

  </div>

</div>



<!-- =========================================
     CONFIG
========================================= -->

<script src="js/config.js"></script>


<script>

/* =========================================
   LOGIN CHECK
========================================= */

requireLogin();



/* =========================================
   MENU
========================================= */

function toggleMenu() {

  const menu =
    document.getElementById("sideMenu");

  const overlay =
    document.getElementById("menuOverlay");


  menu.classList.toggle("show");

  overlay.classList.toggle("show");

}



/* =========================================
   FORM ELEMENTS
========================================= */

const form =
  document.getElementById("form");


const msg =
  document.getElementById("msg");



/* =========================================
   SUBMIT JOB REQUIREMENT
========================================= */

form.addEventListener("submit", async function (e) {

  e.preventDefault();


  msg.className = "";
  msg.textContent = "Saving requirement...";


  try {

    const data =
      Object.fromEntries(
        new FormData(form)
      );


    /* =====================================
       CONVERT NUMBER FIELDS
    ===================================== */

    if (data.workersRequired !== "") {

      data.workersRequired =
        Number(data.workersRequired);

    }


    if (data.experienceMin !== "") {

      data.experienceMin =
        Number(data.experienceMin);

    }


    if (data.experienceMax !== "") {

      data.experienceMax =
        Number(data.experienceMax);

    }


    if (data.salaryMin !== "") {

      data.salaryMin =
        Number(data.salaryMin);

    }


    if (data.salaryMax !== "") {

      data.salaryMax =
        Number(data.salaryMax);

    }


    /* =====================================
       CREATE JOB
    ===================================== */

    const response =
      await api(
        "/jobs",
        {
          method: "POST",

          body:
            JSON.stringify(data)
        }
      );


    console.log(
      "Job Created:",
      response
    );


    /* =====================================
       SUCCESS
    ===================================== */

    msg.className =
      "notice success";

    msg.textContent =
      "Job requirement created successfully";


    form.reset();


  }

  catch (error) {

    console.error(
      "Create Job Error:",
      error
    );


    msg.className =
      "notice error";

    msg.textContent =
      error.message ||
      "Unable to create job requirement";

  }

});

</script>


</body>

</html>
