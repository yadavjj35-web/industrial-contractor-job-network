<!doctype html>
<html>

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Contractor Login</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<div class="container">


  <div class="auth card">


    <h2>
      🔐 Contractor Login
    </h2>


    <p class="muted">
      अपने account में login करें
    </p>


    <div id="msg"></div>


    <form id="form">


      <input
        name="mobile"
        placeholder="Mobile Number"
        required
      >


      <input
        name="password"
        type="password"
        placeholder="Password"
        required
      >


      <button type="submit">

        🔐 Login

      </button>


    </form>


    <!-- =============================
         ADMIN LOGIN
    ============================== -->

    <div
      style="
        margin-top:25px;
        padding-top:20px;
        border-top:1px solid #ddd;
        text-align:center;
      "
    >

      <p
        class="muted"
        style="margin-bottom:10px;"
      >
        Administrator?
      </p>


      <a
        href="admin-login.html"
        style="
          display:inline-block;
          text-decoration:none;
          padding:10px 20px;
          border-radius:8px;
          border:1px solid #ccc;
          color:#333;
          font-weight:600;
        "
      >

        🔐 Admin Login

      </a>

    </div>


  </div>


</div>



<script src="js/config.js"></script>


<script>


/* =====================================
   ALREADY LOGGED IN CHECK
===================================== */

if (getToken()) {

  location.href = "dashboard.html";

}



/* =====================================
   LOGIN
===================================== */

document
  .getElementById("form")
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();


      const form =
        e.target;


      const data =
        Object.fromEntries(
          new FormData(form)
        );


      const msg =
        document.getElementById("msg");


      msg.innerHTML = "";



      try {


        const r =
          await api(
            "/contractors/login",
            {
              method: "POST",

              body:
                JSON.stringify(data)
            }
          );



        /* =============================
           SAVE LOGIN DATA
        ============================= */

        localStorage.setItem(
          "token",
          r.token
        );


        localStorage.setItem(
          "contractor",
          JSON.stringify(r.contractor)
        );



        /* =============================
           GO TO DASHBOARD
        ============================= */

        location.replace(
          "dashboard.html"
        );


      }


      catch(err){


        msg.className =
          "notice error";


        msg.textContent =
          err.message ||
          "Login failed";


      }


    }
  );


</script>


</body>
</html>
