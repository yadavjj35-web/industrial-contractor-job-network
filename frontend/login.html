<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="style.css"></head><body><div class="container">
<div class="auth card"><h2>Contractor Login</h2><div id="msg"></div><form id="form"><input name="mobile" placeholder="Mobile Number" required><input name="password" type="password" placeholder="Password" required><button>Login</button></form><p>New contractor? <a href="register.html">Register</a></p></div>
</div><script src="js/config.js"></script><script>
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const m=document.getElementById('msg');try{const r=await api('/contractors/login',{method:'POST',body:JSON.stringify(d)});localStorage.setItem('token',r.token);localStorage.setItem('contractor',JSON.stringify(r.contractor));location.href='dashboard.html'}catch(err){m.className='notice error';m.textContent=err.message}}
</script></body></html>
